[workspace]
members = [
    "crates/orbit-linux-domain",
    "crates/orbit-linux-application",
    "crates/orbit-linux-bridge",
    "crates/orbit-linux-platform",
    "crates/orbit-linux-session",
    "crates/orbit-linux-sync",
    "crates/orbit-linux-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Proprietary"

[workspace.dependencies]
glib = "0.22.6"
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
vte = { package = "vte4", version = "0.10.0", features = ["v0_76"] }
libsecret = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1.8"
regex = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
rand = "0.10"
ssh-key = { package = "internal-russh-forked-ssh-key", version = "0.6.18", features = ["ed25519", "getrandom"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
