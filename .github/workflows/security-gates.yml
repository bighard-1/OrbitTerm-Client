name: Security Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_signed_macos_ui_smoke:
        description: Run the signed macOS UI smoke lane on a provisioned self-hosted Mac
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-security-gates:
    name: Rust release gates
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install workflow tools
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path orbit-core/Cargo.toml
      - name: Rust tests, release harness, headers, symbols, and static scans
        run: |
          scripts/security/check_static_scans.sh
          python3 scripts/performance/verify_desktop_stabilization_gate.py
          scripts/security/check_rust_release_gates.sh
          scripts/security/check_symbols.sh

  apple-security-gates:
    name: Apple checked-path gates
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Apple Rust targets and XcodeGen
        run: |
          rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path orbit-core/Cargo.toml
      - name: Build audited macOS FreeRDP runtime
        run: scripts/build_freerdp_macos.sh
      - name: Swift static scans and Apple build matrix
        run: |
          scripts/security/check_static_scans.sh
          scripts/security/check_apple_release_gates.sh
      # External OpenSSH scenarios remain a separate release-candidate gate.

  macos-signed-ui-smoke:
    name: macOS signed UI smoke (release candidate)
    if: github.event_name == 'workflow_dispatch' && inputs.run_signed_macos_ui_smoke
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate and run the signed macOS UI smoke lane
        env:
          ORBITTERM_RUN_SIGNED_MACOS_UI_SMOKE: '1'
        run: scripts/security/run_macos_signed_ui_smoke.sh

  android-release-gates:
    name: Android release gates
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install workflow tools
        run: brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Android source build, tests and Release artifact gates
        run: scripts/security/check_android_release_gates.sh

  android-instrumentation-gates:
    name: Android instrumentation and migration gates
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Prebuild Android instrumentation artifacts
        working-directory: clients/android/OrbitTermAndroid
        run: |
          ./gradlew --no-daemon \
            :core:assembleDebug :core:assembleDebugAndroidTest \
            :feature:assembleDebug :feature:assembleDebugAndroidTest \
            :app:assembleDebug :app:assembleDebugAndroidTest \
            :app:assembleSmoke
      - name: Run connected tests on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORBITTERM_ANDROID_TEST_PROFILE: aosp-atd-api35
        with:
          api-level: 35
          # ATD keeps Android 15/API 35 behavior while avoiding the unused
          # Google services that make software-emulated hosted runners time out.
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: scripts/security/check_android_instrumentation_gates.sh
      - name: Preserve Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: |
            clients/android/OrbitTermAndroid/app/build/reports/androidTests/connected/**
            clients/android/OrbitTermAndroid/app/build/outputs/androidTest-results/connected/**
            clients/android/OrbitTermAndroid/core/build/reports/androidTests/connected/**
            clients/android/OrbitTermAndroid/core/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: Dependency vulnerability and license scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan locked Gradle and Cargo dependencies
        # v0.36.0, pinned to its immutable release commit after the upstream
        # March 2026 credential-compromise response invalidated older tags.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  openssh-release-candidate-smoke:
    name: OpenSSH release-candidate smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path orbit-core/Cargo.toml
      - name: Run isolated loopback OpenSSH smoke
        env:
          ORBITTERM_RUN_OPENSSH_SMOKE: '1'
        run: scripts/security/run_openssh_smoke.sh
