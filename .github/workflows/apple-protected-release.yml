name: Apple Protected Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full immutable commit SHA to release
        required: true
        type: string
      release_version:
        description: Approved marketing version, for example 1.0.1
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-production-release
  cancel-in-progress: false

jobs:
  sign-notarize-and-collect-evidence:
    name: Sign, notarize and collect Apple release evidence
    runs-on: macos-15
    timeout-minutes: 70
    # Create this GitHub environment with required reviewers before enabling
    # this workflow. All signing material remains in its environment secrets.
    environment:
      name: apple-production-release
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      ORBITTERM_RELEASE_VERSION: ${{ inputs.release_version }}
      ORBITTERM_RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.ORBITTERM_RELEASE_KEYCHAIN_PASSWORD }}
      ORBITTERM_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.ORBITTERM_IOS_DISTRIBUTION_P12_BASE64 }}
      ORBITTERM_IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.ORBITTERM_IOS_DISTRIBUTION_P12_PASSWORD }}
      ORBITTERM_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.ORBITTERM_MACOS_DEVELOPER_ID_P12_BASE64 }}
      ORBITTERM_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.ORBITTERM_MACOS_DEVELOPER_ID_P12_PASSWORD }}
      ORBITTERM_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ORBITTERM_IOS_PROVISIONING_PROFILE_BASE64 }}
      ORBITTERM_IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.ORBITTERM_IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
      ORBITTERM_NOTARY_API_KEY_BASE64: ${{ secrets.ORBITTERM_NOTARY_API_KEY_BASE64 }}
      ORBITTERM_NOTARY_KEY_ID: ${{ secrets.ORBITTERM_NOTARY_KEY_ID }}
      ORBITTERM_NOTARY_ISSUER_ID: ${{ secrets.ORBITTERM_NOTARY_ISSUER_ID }}
      ORBITTERM_APPLE_TEAM_ID: ${{ secrets.ORBITTERM_APPLE_TEAM_ID }}
      ORBITTERM_IOS_CODESIGN_IDENTITY: ${{ secrets.ORBITTERM_IOS_CODESIGN_IDENTITY }}
      ORBITTERM_IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.ORBITTERM_IOS_PROVISIONING_PROFILE_SPECIFIER }}
      ORBITTERM_MACOS_CODESIGN_IDENTITY: ${{ secrets.ORBITTERM_MACOS_CODESIGN_IDENTITY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set protected release workspace paths
        shell: bash
        run: echo "ORBITTERM_RELEASE_KEYCHAIN_PATH=$RUNNER_TEMP/orbitterm-release.keychain-db" >> "$GITHUB_ENV"

      - name: Verify immutable release reference
        shell: bash
        run: |
          [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "release_ref must be a full immutable commit SHA" >&2
            exit 1
          }
          test -z "$(git status --porcelain)"
          [[ "$(git rev-parse HEAD)" == "${RELEASE_REF,,}" ]] || {
            echo "checked out commit differs from release_ref" >&2
            exit 1
          }

      - name: Verify completed CI for the exact release commit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.popen("git rev-parse HEAD").read().strip()
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/workflows/security-gates.yml/runs?head_sha={sha}&status=completed&per_page=20")
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not any(run.get("conclusion") == "success" for run in runs):
              raise SystemExit("no successful Security Gates run exists for the release commit")
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install locked project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Run unsigned source and release gates first
        run: scripts/security/check_apple_release_gates.sh

      - name: Materialize protected signing credentials
        run: scripts/security/materialize_apple_release_credentials.sh

      - name: Archive iOS distribution build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project OrbitTerm.xcodeproj \
            -scheme OrbitTerm_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OrbitTerm-iOS.xcarchive" \
            MARKETING_VERSION="$ORBITTERM_RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$ORBITTERM_APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$ORBITTERM_IOS_CODESIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$ORBITTERM_IOS_PROVISIONING_PROFILE_SPECIFIER"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OrbitTerm-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$ORBITTERM_IOS_EXPORT_OPTIONS_PLIST"

      - name: Archive signed macOS application and notarize DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project OrbitTerm.xcodeproj \
            -scheme OrbitTerm_macOS \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -archivePath "$RUNNER_TEMP/OrbitTerm-macOS.xcarchive" \
            MARKETING_VERSION="$ORBITTERM_RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$ORBITTERM_APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$ORBITTERM_MACOS_CODESIGN_IDENTITY"
          app="$RUNNER_TEMP/OrbitTerm-macOS.xcarchive/Products/Applications/OrbitTerm.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          scripts/create_macos_drag_dmg.sh "$app" "$RUNNER_TEMP/OrbitTerm-macOS.dmg" OrbitTerm
          xcrun notarytool submit "$RUNNER_TEMP/OrbitTerm-macOS.dmg" \
            --key "$ORBITTERM_NOTARY_API_KEY_PATH" \
            --key-id "$ORBITTERM_NOTARY_KEY_ID" \
            --issuer "$ORBITTERM_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/OrbitTerm-macOS.dmg"
          xcrun stapler validate "$RUNNER_TEMP/OrbitTerm-macOS.dmg"
          hdiutil verify "$RUNNER_TEMP/OrbitTerm-macOS.dmg"

      - name: Collect immutable release evidence and checksums
        run: |
          evidence="$RUNNER_TEMP/apple-release-evidence"
          scripts/security/collect_apple_build_evidence.sh "$evidence"
          shasum -a 256 "$RUNNER_TEMP/ios-export"/*.ipa "$RUNNER_TEMP/OrbitTerm-macOS.dmg" \
            > "$evidence/artifact-checksums.txt"
          codesign -dv --verbose=4 "$RUNNER_TEMP/OrbitTerm-macOS.xcarchive/Products/Applications/OrbitTerm.app" \
            > "$evidence/signing-verification.txt" 2>&1

      - name: Upload protected release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ios-export/*.ipa
            ${{ runner.temp }}/OrbitTerm-macOS.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload restricted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-evidence/**
          if-no-files-found: warn
          retention-days: 365

      - name: Remove signing material
        if: always()
        run: scripts/security/cleanup_apple_release_credentials.sh
