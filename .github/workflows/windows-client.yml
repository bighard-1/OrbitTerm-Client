name: Windows Client

on:
  pull_request:
    paths:
      - "clients/windows/**"
      - "orbit-core/**"
      - ".github/workflows/windows-client.yml"
  push:
    branches: [main]
    paths:
      - "clients/windows/**"
      - "orbit-core/**"
      - ".github/workflows/windows-client.yml"

permissions:
  contents: read

jobs:
  native-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orbit-core
      - name: Verify Windows static and release gates
        shell: pwsh
        run: clients/windows/scripts/check_windows_static.ps1
      - name: Build orbit-core for Windows x64
        shell: pwsh
        run: clients/windows/scripts/build_windows_core.ps1
      - name: Run Windows tests and build WinUI x64 Release
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "orbitterm-windows-validation.log"
          & pwsh -NoProfile -File clients/windows/scripts/validate_current_windows_build.ps1 *>&1 |
            Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $summary = (Get-Content -LiteralPath $log -Tail 24) -join "`n"
            $summary = $summary.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=Windows tests or WinUI build failed::$summary"
            exit $exitCode
          }
