name: OrbitTerm
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.orbitterm.app
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 20260624
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.11.2

targets:
  OrbitTerm:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: OrbitTerm
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: OrbitTerm/CBridge/OrbitTerm-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/OrbitTerm/CBridge
          - $(SRCROOT)/orbit-core/include
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos macosx
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS[sdk=macosx*]: arm64
        ONLY_ACTIVE_ARCH[sdk=macosx*]: YES
        ARCHS[sdk=iphonesimulator*]: arm64
        ONLY_ACTIVE_ARCH[sdk=iphonesimulator*]: YES
      configs:
        Debug:
          OTHER_LDFLAGS[sdk=macosx*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-darwin/debug/liborbit_core.a
          OTHER_LDFLAGS[sdk=iphonesimulator*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-ios-sim/debug/liborbit_core.a
          OTHER_LDFLAGS[sdk=iphoneos*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-ios/debug/liborbit_core.a
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ORBITTERM_PUBLIC_RELEASE
          OTHER_LDFLAGS[sdk=macosx*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-darwin/release/liborbit_core.a
          OTHER_LDFLAGS[sdk=iphonesimulator*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-ios-sim/release/liborbit_core.a
          OTHER_LDFLAGS[sdk=iphoneos*]:
            - $(inherited)
            - $(SRCROOT)/orbit-core/target/aarch64-apple-ios/release/liborbit_core.a
    scheme:
      testTargets: []

  OrbitTermCheckedFFITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OrbitTermCheckedFFITests
      - path: OrbitTerm
        includes:
          - Core/CheckedFFI/*.swift
          - Core/HostKeyTrust/*.swift
          - Core/TelnetAccessPolicy.swift
        excludes:
          - Core/CheckedFFI/CredentialVaultCheckedProvider.swift
          - Core/CheckedFFI/OrbitCoreCheckedFFILiveFunctions.swift
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitterm.checkedffi.tests
        SWIFT_VERSION: 5.0

schemes:
  OrbitTermCheckedFFITests:
    build:
      targets:
        OrbitTermCheckedFFITests: [test, analyze]
    test:
      targets:
        - OrbitTermCheckedFFITests
