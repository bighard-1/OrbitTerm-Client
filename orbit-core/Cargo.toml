[package]
name = "orbit-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbit_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
legacy-network-internal = []

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
hkdf = "0.12"
once_cell = "1"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
regex = "1"
russh = { version = "0.61.2", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "fs", "io-util", "sync", "process"] }
uniffi = { version = "0.29", features = ["tokio"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = true
codegen-units = 1
strip = true
